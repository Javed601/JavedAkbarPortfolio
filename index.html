  <body>
    <noscript></noscript>
    <div id="root"></div>
    <script>
      (function () {
        const search = window.location.search;

        if (!search.startsWith("?/")) {
          return;
        }

        const route = search
          .slice(2)
          .split("&")
          .map((part) => part.replace(/~and~/g, "&"))
          .join("?");
        const basePath = window.location.pathname.replace(/\/$/, "");
        const nextPath = route.startsWith("/") ? route : `/${route}`;

        window.history.replaceState(null, "", `${basePath}${nextPath}${window.location.hash}`);
      })();
    </script>
